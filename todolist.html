    <input type="date" class="js-date">
      <button onclick="
      todoFunction();

   <script>
   let local = JSON.parse(localStorage.getItem("todo"));    
       let todoList = []        
       let html = '';
       function todoArray(){
           let todoListHhml = '';
        for (let i = 0; i < todoList.length; i++){
          let looped = todoList[i];
          let todo = looped.list;
          let date = looped.date
            html = `<p>
            ${todo}
            ${date}
               
              <button onclick="
                todoList.splice(${i},1);
                todoArray();
               "class="js-delete">Delete</button>
              </p>`;
              todoListHhml += html;    
               
            };            
          localStorage.setItem("todo",JSON.stringify(html));      
        document.querySelector('.js-html').innerHTML = todoListHhml;

       }

    
     function todoFunction(){
      let todo = document.querySelector('.js-input');
      let date = document.querySelector('.js-date')      
      let todoValue = todo.value;
      let dueDate = date.value;
      todoList.push({
        list : todoValue,
        date :dueDate
      })
      todo.value = '';
       todoArray()
     }
